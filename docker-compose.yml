services:
  localemu:
    container_name: "${LOCALEMU_DOCKER_NAME:-localemu-main}"
    image: localemu/localemu
    restart: unless-stopped
    ports:
      - "127.0.0.1:4566:4566"            # LocalEmu Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalEmu configuration: https://localemu.cloud/docs/configuration
      - DEBUG=${DEBUG:-0}
      # Lets the web console (a separate container) read the dashboard API
      # (activity feed, service registry). The host port above is bound to
      # 127.0.0.1, so this does not expose it beyond your machine.
      - DASHBOARD_API_OPEN=${DASHBOARD_API_OPEN:-1}
    volumes:
      - "${LOCALEMU_VOLUME_DIR:-./volume}:/var/lib/localemu"
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      resources:
        limits:
          memory: ${LOCALEMU_MEM_LIMIT:-4g}
          cpus: "${LOCALEMU_CPU_LIMIT:-2.0}"

  # AWS-console style web UI for LocalEmu (Astro + Tailwind). See ui/README.md.
  console:
    container_name: "${LOCALEMU_CONSOLE_DOCKER_NAME:-localemu-console}"
    build: ./ui
    # Or skip the local build and pull the prebuilt multi-arch image:
    # image: ghcr.io/tusuii/localemu-console:latest
    restart: unless-stopped
    depends_on:
      - localemu
    ports:
      - "127.0.0.1:4321:4321"            # LocalEmu Console
    environment:
      # How the console server reaches LocalEmu (container-to-container)...
      - LOCALEMU_ENDPOINT=http://localemu:4566
      # ...and how your browser reaches it (used for pre-signed URLs).
      - LOCALEMU_PUBLIC_ENDPOINT=http://localhost:4566
